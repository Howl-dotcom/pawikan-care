services:
  - type: web
    name: pawikancare
    env: php
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      npm install
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      php artisan migrate --force
      php artisan db:seed --class=UserSeeder --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_NAME
        value: PawikanCare
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: pawikancare
          property: host
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: pawikancare-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pawikancare-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: pawikancare-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: pawikancare-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pawikancare-db
          property: password
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

databases:
  - name: pawikancare-db
    databaseName: pawikancare
    user: pawikancare
